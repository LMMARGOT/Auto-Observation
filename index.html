<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Auto-obs. TCC" />
<title>Auto-observation</title>
<style>
  :root {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color: #1c1c1e;
    background: #f2f2f7;
    --accent: #007aff;
    --card: #ffffff;
    --border: #e5e5ea;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding-bottom: 40px; }
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(242,242,247,.92);
    backdrop-filter: blur(10px);
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 22px; font-weight: 700; margin: 0; }
  header p { margin: 2px 0 0; font-size: 13px; color: #8e8e93; }
  main { padding: 16px; max-width: 640px; margin: 0 auto; }

  .card {
    background: var(--card); border-radius: 14px;
    padding: 16px; margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  label { display: block; font-size: 13px; font-weight: 600; color: #3a3a3c; margin: 12px 0 4px; }
  label:first-child { margin-top: 0; }
  input, textarea {
    width: 100%; font-size: 16px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 10px;
    background: #f9f9fb; color: inherit; font-family: inherit;
    -webkit-appearance: none; appearance: none;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  textarea { min-height: 64px; resize: vertical; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }

  button.primary {
    width: 100%; margin-top: 16px; padding: 14px;
    font-size: 17px; font-weight: 600; color: #fff;
    background: var(--accent); border: none; border-radius: 12px;
  }
  button.primary:active { opacity: .7; }

  .entry { border-left: 4px solid var(--accent); }
  .entry h2 { font-size: 14px; color: #8e8e93; font-weight: 600; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
  .entry dl { margin: 0; }
  .entry dt { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: #007aff; margin-top: 8px; }
  .entry dd { margin: 2px 0 0; font-size: 15px; white-space: pre-wrap; }
  .entry .del {
    font-size: 13px; color: #ff3b30; background: none; border: none;
    font-weight: 600; padding: 4px 8px;
  }
  .empty { text-align: center; color: #8e8e93; font-size: 15px; padding: 24px 8px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; }
  .toolbar button {
    flex: 1; padding: 10px; font-size: 14px; font-weight: 600;
    background: var(--card); color: var(--accent);
    border: 1px solid var(--border); border-radius: 10px;
  }
  .toolbar button.danger { color: #ff3b30; }
  .saved { text-align: center; color: #34c759; font-size: 14px; font-weight: 600; height: 20px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>Auto-observation</h1>
  <p>Date · Situation · Émotions · Pensées · Comportements</p>
</header>
<main>
  <div class="card">
    <form id="form">
      <div class="row">
        <div>
          <label for="date">Date</label>
          <input type="date" id="date" required />
        </div>
        <div>
          <label for="heure">Heure (facultatif)</label>
          <input type="time" id="heure" />
        </div>
      </div>
      <label for="situation">Situation</label>
      <textarea id="situation" placeholder="Environnement, évènement, situation pénible (quand, où, avec qui, que fais-je ?)" required></textarea>
      <label for="emotion">Émotions</label>
      <input type="text" id="emotion" placeholder="Ce que je ressens (mes émotions et évaluation de leur intensité de 0 à 10)" required />
      <label for="pensee">Pensées</label>
      <textarea id="pensee" placeholder="Ce que je pense, ce que je me dis avant, pendant ou après avoir ressenti l'émotion pénible" required></textarea>
      <label for="comportement">Comportements</label>
      <textarea id="comportement" placeholder="Ce que je fais juste après avoir éprouvé cette émotion" required></textarea>
      <button class="primary" type="submit">Ajouter l'entrée</button>
      <div class="saved" id="saved"></div>
    </form>
  </div>

  <div class="toolbar">
    <button type="button" id="export">Exporter (CSV)</button>
    <button type="button" class="danger" id="clear">Tout effacer</button>
  </div>

  <div id="entries"></div>
</main>

<script>
  var KEY = 'auto-observation-tcc';
  var entries = [];
  try { entries = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { entries = []; }

  function save() { localStorage.setItem(KEY, JSON.stringify(entries)); }

  function fmtDate(iso) {
    var p = iso.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function render() {
    var box = document.getElementById('entries');
    var sorted = entries.slice().sort(function (a, b) { return b.id - a.id; });
    if (sorted.length === 0) {
      box.innerHTML = '<div class="card empty">Aucune entrée pour le moment.<br/>Remplissez le formulaire ci-dessus pour commencer votre suivi.</div>';
      return;
    }
    box.innerHTML = sorted.map(function (e) {
      return '<div class="card entry">' +
        '<h2><span>' + fmtDate(e.date) + (e.heure ? ' · ' + e.heure : '') + '</span>' +
        '<button class="del" data-id="' + e.id + '">Supprimer</button></h2>' +
        '<dl>' +
        '<dt>Situation</dt><dd>' + esc(e.situation) + '</dd>' +
        '<dt>Émotions</dt><dd>' + esc(e.emotion) + '</dd>' +
        '<dt>Pensées</dt><dd>' + esc(e.pensee) + '</dd>' +
        '<dt>Comportements</dt><dd>' + esc(e.comportement) + '</dd>' +
        '</dl></div>';
    }).join('');
    box.querySelectorAll('.del').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = Number(btn.getAttribute('data-id'));
        entries = entries.filter(function (e) { return e.id !== id; });
        save(); render();
      });
    });
  }

  document.getElementById('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var v = function (id) { return document.getElementById(id).value.trim(); };
    entries.push({
      id: Date.now(),
      date: v('date'),
      heure: v('heure'),
      situation: v('situation'),
      emotion: v('emotion'),
      pensee: v('pensee'),
      comportement: v('comportement')
    });
    save(); render();
    document.getElementById('form').reset();
    var s = document.getElementById('saved');
    s.textContent = '✔ Enregistré';
    setTimeout(function () { s.textContent = ''; }, 1500);
  });

  document.getElementById('export').addEventListener('click', function () {
    if (entries.length === 0) { alert('Aucune entrée à exporter.'); return; }
    var rows = [['Date', 'Heure', 'Situation', 'Émotions', 'Pensées', 'Comportements']];
    entries.slice().sort(function (a, b) { return a.id - b.id; }).forEach(function (e) {
      rows.push([e.date, e.heure || '', e.situation, e.emotion, e.pensee, e.comportement]);
    });
    var csv = '\uFEFF' + rows.map(function (r) {
      return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(';');
    }).join('\r\n');
    var a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
    a.download = 'auto-observation-tcc.csv';
    a.click();
  });

  document.getElementById('clear').addEventListener('click', function () {
    if (entries.length === 0) return;
    if (confirm('Supprimer définitivement toutes les entrées ?')) {
      entries = []; save(); render();
    }
  });

  // Pré-remplir avec la date du jour
  var now = new Date();
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  document.getElementById('date').value = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
  document.getElementById('heure').value = pad(now.getHours()) + ':' + pad(now.getMinutes());

  render();
</script>
</body>
</html>
